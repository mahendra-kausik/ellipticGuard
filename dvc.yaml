# dvc.yaml — pipeline stages added incrementally, one per layer.
stages:
  assemble:
    cmd: python pipelines/assemble.py
    deps:
      - data/raw/elliptic_txs_features.csv
      - data/raw/elliptic_txs_classes.csv
      - data/raw/elliptic_txs_edgelist.csv
      - src/data/loaders.py
      - pipelines/assemble.py
    outs:
      - data/processed/nodes.parquet
      - data/processed/edges.parquet
  split_eda:
    cmd: python pipelines/split_eda.py
    deps:
      - data/processed/nodes.parquet
      - data/processed/edges.parquet
      - src/data/split.py
      - src/data/eda.py
      - pipelines/split_eda.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
    outs:
      - data/processed/eda_per_time_step.csv
  train_baseline:
    cmd: python pipelines/train_baseline.py
    deps:
      - data/processed/nodes.parquet
      - src/data/split.py
      - src/models/baseline.py
      - pipelines/train_baseline.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
      - baseline.random_state
      - baseline.lr_max_iter
      - baseline.rf_n_estimators
      - baseline.rf_max_depth
    outs:
      - data/processed/baseline_metrics.json
  build_graph_features:
    cmd: python pipelines/build_graph_features.py
    deps:
      - data/processed/nodes.parquet
      - data/processed/edges.parquet
      - src/features/graph.py
      - pipelines/build_graph_features.py
    outs:
      - data/processed/graph_features.parquet
  train_advanced:
    cmd: python pipelines/train_advanced.py
    deps:
      - data/processed/nodes.parquet
      - data/processed/graph_features.parquet
      - src/data/split.py
      - src/models/baseline.py
      - src/models/advanced.py
      - pipelines/train_advanced.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
      - advanced.random_state
      - advanced.grid
    outs:
      - data/processed/advanced_metrics.json
  evaluate_champion:
    cmd: python pipelines/evaluate_champion.py
    deps:
      - data/processed/nodes.parquet
      - data/processed/advanced_metrics.json
      - src/data/split.py
      - src/models/baseline.py
      - src/models/advanced.py
      - src/models/evaluate.py
      - pipelines/evaluate_champion.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
      - advanced.random_state
      - evaluate.calibration_methods
      - evaluate.shap_sample
      - evaluate.shap_top_n
    outs:
      - data/processed/per_time_step_f1.csv
      - data/processed/evaluation.json
  monitor_drift:
    cmd: python pipelines/monitor_drift.py
    deps:
      - data/processed/nodes.parquet
      - src/data/loaders.py
      - src/data/split.py
      - src/monitoring/drift.py
      - pipelines/monitor_drift.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
      - monitor.report_step
    outs:
      - data/processed/drift_by_time_step.csv
      - data/processed/drift_report.html
  replay_retraining:
    cmd: python pipelines/replay_retraining.py
    deps:
      - data/processed/nodes.parquet
      - data/processed/advanced_metrics.json
      - src/data/split.py
      - src/models/baseline.py
      - src/models/advanced.py
      - src/models/evaluate.py
      - src/monitoring/drift.py
      - src/retraining/replay.py
      - pipelines/replay_retraining.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
      - advanced.random_state
      - retrain.f1_floor
      - retrain.drift_ceiling
      - retrain.promote_margin
    outs:
      - data/processed/replay_log.csv
    metrics:
      - metrics/quality_gate.json:
          cache: false
