# dvc.yaml — pipeline stages added incrementally, one per layer.
stages:
  assemble:
    cmd: python pipelines/assemble.py
    deps:
      - data/raw/elliptic_txs_features.csv
      - data/raw/elliptic_txs_classes.csv
      - data/raw/elliptic_txs_edgelist.csv
      - src/data/loaders.py
      - pipelines/assemble.py
    outs:
      - data/processed/nodes.parquet
      - data/processed/edges.parquet
  split_eda:
    cmd: python pipelines/split_eda.py
    deps:
      - data/processed/nodes.parquet
      - data/processed/edges.parquet
      - src/data/split.py
      - src/data/eda.py
      - pipelines/split_eda.py
    params:
      - split.train_end
      - split.val_start
      - split.test_start
      - split.test_end
    outs:
      - data/processed/eda_per_time_step.csv
