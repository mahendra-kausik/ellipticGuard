# params.yaml — pipeline parameters added incrementally, one per layer.

split:
  # Temporal split (Layer 2). train = steps < val_start; val = [val_start, train_end]
  # (carved from the tail of the training range); test = [test_start, test_end].
  # See PROJECT_PLAN.md Layer 2 / DECISIONS.md D-001 — never change to a random split.
  train_end: 34
  val_start: 30
  test_start: 35
  test_end: 49

baseline:
  # Layer 3 — LR + RF baselines. class_weight="balanced" handles imbalance (D-008 applies
  # class-weight strategy from the start; SMOTE-style resampling is out per that decision).
  random_state: 42
  lr_max_iter: 1000
  rf_n_estimators: 100
  rf_max_depth: null

advanced:
  # Layer 5 — XGBoost champion. scale_pos_weight handles imbalance (see D-022).
  # grid is a small manual search, scored on the val slice only (never test).
  random_state: 42
  grid:
    max_depth: [4, 6, 8]
    learning_rate: [0.05, 0.1]
    n_estimators: [200, 400]

evaluate:
  # Layer 6 — calibration methods compared on test Brier (calibrator fit on val
  # only, cv="prefit"); lean SHAP sample size/top-N. See D-023.
  calibration_methods: [sigmoid, isotonic]
  shap_sample: 2000
  shap_top_n: 15

monitor:
  # Layer 9 — Evidently drift reference is always split.train (steps 1-29, fit-only).
  # report_step picks one late window to render as a full human-readable HTML report;
  # 43 is the T43 regime-change step already surfaced in Layer 6 (D-023).
  report_step: 43

retrain:
  # Layer 10 — replay driver + drift-or-performance flag + champion/challenger gate.
  # Champion = the Layer 6 train-only model (steps 1-29). f1_floor: well under the
  # ~0.85 pre-T43 per-step mean (Layer 6), so nominal steps don't trip it but a
  # T43-style collapse (~0.03) clearly does. drift_ceiling: at the target-drift
  # knee Layer 9 found (pre-T43 mean 0.052 vs post-T43 mean 0.117). promote_margin:
  # the minimum illicit-F1 edge a challenger needs over the champion to promote.
  f1_floor: 0.5
  drift_ceiling: 0.1
  promote_margin: 0.01
